
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Udyog Saheli - WhatsApp Advisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://samora-widget-prod-856521071527-ap-south-1-an.s3.ap-south-1.amazonaws.com/samora-widgets.css" />
    <script src="https://samora-widget-prod-856521071527-ap-south-1-an.s3.ap-south-1.amazonaws.com/samora-widgets.iife.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
            background-color: #dadbd3;
            height: 100dvh;
            margin: 0;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        .whatsapp-bg {
            background-color: #e5ddd5;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay;
            background-repeat: repeat;
        }
        .devanagari {
            font-family: 'Noto Sans Devanagari', sans-serif;
        }
        .bubble-user {
            background-color: #dcf8c6;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }
        .bubble-saheli {
            background-color: #ffffff;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }
        @keyframes pulse-mic {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(18, 140, 126, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(18, 140, 126, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(18, 140, 126, 0); }
        }
        .mic-active {
            animation: pulse-mic 1.5s infinite;
            background-color: #128c7e !important;
        }
        .mobile-container {
            width: 100%;
            max-width: 500px;
            background: white;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root" class="mobile-container"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
